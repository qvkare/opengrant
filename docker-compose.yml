version: "3.8"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: opengrant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opengrant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/drizzle:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: opengrant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API Server
  # ============================================
  api:
    build:
      context: .
      target: api
    container_name: opengrant-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opengrant
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-opengrant-dev-secret}
      CHAIN_ID: ${CHAIN_ID:-8453}
      RPC_URL: ${RPC_URL:-https://mainnet.base.org}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      PLATFORM_WALLET: ${PLATFORM_WALLET}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Web App
  # ============================================
  web:
    build:
      context: .
      target: web
    container_name: opengrant-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_PARTICLE_PROJECT_ID: ${NEXT_PUBLIC_PARTICLE_PROJECT_ID}
      NEXT_PUBLIC_PARTICLE_CLIENT_KEY: ${NEXT_PUBLIC_PARTICLE_CLIENT_KEY}
      NEXT_PUBLIC_PARTICLE_APP_ID: ${NEXT_PUBLIC_PARTICLE_APP_ID}
      NEXT_PUBLIC_CHAIN_ID: ${CHAIN_ID:-8453}
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: opengrant-network
