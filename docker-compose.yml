version: "3.8"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: opengrant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opengrant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/drizzle:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: opengrant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API Server
  # ============================================
  api:
    build:
      context: .
      target: api
    container_name: opengrant-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opengrant
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-opengrant-dev-secret}
      CHAIN_ID: ${CHAIN_ID:-84532}
      RPC_URL: ${RPC_URL:-https://sepolia.base.org}
      X402_FACILITATOR_URL: ${X402_FACILITATOR_URL:-https://x402.org/facilitator}
      PLATFORM_WALLET: ${PLATFORM_WALLET}
      USDC_ADDRESS: ${USDC_ADDRESS:-0x036CbD53842c5426634e7929541eC2318f3dCF7e}
      OPENGRANT_PAYMENTS_ADDRESS: ${OPENGRANT_PAYMENTS_ADDRESS:-0x2a5766F112666B52d2D7E2280dBa76CC3FC6d135}
      OPENGRANT_REGISTRY_ADDRESS: ${OPENGRANT_REGISTRY_ADDRESS:-0x9E82afb28b87957AFe50464A5717b5B53E395D0D}
      SKIP_X402_FACILITATOR: ${SKIP_X402_FACILITATOR:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # Web App
  # ============================================
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.opengrant.dev}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-https://opengrant.dev}
    container_name: opengrant-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
      NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-https://opengrant.dev}
      NEXT_PUBLIC_CHAIN_ID: ${CHAIN_ID:-84532}
    depends_on:
      - api

  # ============================================
  # Landing Page
  # ============================================
  landing:
    build:
      context: .
      target: landing
    container_name: opengrant-landing
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.opengrant.dev}

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: opengrant-network
