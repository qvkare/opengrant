[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
evm_version = "cancun"

[profile.default.fmt]
bracket_spacing = true
int_types = "long"
line_length = 100
multiline_func_header = "all"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"
world_sepolia = "${WORLD_SEPOLIA_RPC_URL}"
world_mainnet = "${WORLD_MAINNET_RPC_URL}"

# Contract verification (Etherscan V2 unified API)
[etherscan]
base_sepolia = { key = "verifyContract", url = "https://base-sepolia.blockscout.com/api/" }
base_mainnet = { key = "verifyContract", url = "https://base.blockscout.com/api/" }
world_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 4801, url = "https://api.etherscan.io/v2/api?chainid=4801" }
world_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 480, url = "https://api.etherscan.io/v2/api?chainid=480" }
